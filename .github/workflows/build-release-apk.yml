name: Release

on:
  push:
    tags:
      - 'v*'

# Only ever fired by pushing a tag. Nothing here runs on an ordinary commit, so a release
# is always something someone decided to do.
permissions:
  contents: write

jobs:
  release:
    name: Build and publish a release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Checked before anything is built. A tag that disagrees with versionName publishes
      # an APK reporting the wrong version and cannot be corrected afterwards, and a
      # missing notes file otherwise fails at the last step, after a full build has run.
      - name: Check the tag against the source
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES="docs/releasenote/release_notes_${GITHUB_REF_NAME}.md"

          if [ ! -f "$NOTES" ]; then
            echo "::error::$NOTES does not exist. Write the release notes before tagging."
            exit 1
          fi

          DECLARED=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -n 1)
          if [ -z "$DECLARED" ]; then
            echo "::error::Could not read versionName out of app/build.gradle.kts."
            exit 1
          fi
          if [ "$DECLARED" != "$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME says $VERSION, app/build.gradle.kts says $DECLARED."
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME matches versionName $DECLARED."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore the signing key
        shell: bash
        env:
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
        run: |
          if [ -z "$RELEASE_KEYSTORE" ]; then
            echo "::error::RELEASE_KEYSTORE is not set. Nothing can be signed."
            exit 1
          fi
          echo "$RELEASE_KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false
      - name: Resolve engine dependencies
        shell: bash
        run: cd engine && go mod tidy
      - name: Build the engine
        shell: bash
        run: tools/build_engine.sh 2>&1 | tee engine.log
      - name: Engine tests
        shell: bash
        run: cd engine && go test ./...
      - name: Tests
        shell: bash
        run: gradle --no-daemon testDebugUnitTest
      - name: Build
        shell: bash
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease

      - name: Publish
        shell: bash
        env:
          # A release published with the built-in token is credited to
          # github-actions[bot], and a release author cannot be changed afterwards.
          GH_TOKEN: ${{ secrets.RELEASE_PAT || github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          if [ -z "$APK" ]; then
            echo "::error::No APK was produced."
            exit 1
          fi
          NAMED="SonderShield-$VERSION.apk"
          cp "$APK" "$NAMED"

          gh release create "$GITHUB_REF_NAME" "$NAMED" \
            --repo "$GITHUB_REPOSITORY" \
            --title "SonderShield $VERSION" \
            --notes-file docs/releasenote/release_notes_$GITHUB_REF_NAME.md

      - name: Report the failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_STORE_FILE: ${{ runner.temp }}/release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          # CI logs are not fetchable from outside, so the error is attached to a
          # pre-release called ci-failure in this repository, where the API can read it.
          gradle --no-daemon assembleRelease > out.txt 2>&1 || true
          [ -f engine.log ] && tail -n 60 engine.log >> out.txt
          gh release view ci-failure --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create ci-failure --repo "$GITHUB_REPOSITORY" --prerelease \
              --title "Last CI failure" --notes "Replaced on every failed build."
          echo "$GITHUB_WORKFLOW on $GITHUB_REF_NAME at $GITHUB_SHA" | cat - out.txt > failure.txt
          gh release upload ci-failure failure.txt --repo "$GITHUB_REPOSITORY" --clobber

  windows:
    name: Windows app and installer
    needs: release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false
      - name: Resolve engine dependencies
        shell: bash
        run: cd engine && go mod tidy
      - name: Get wintun.dll
        shell: pwsh
        run: |
          Invoke-WebRequest https://www.wintun.net/builds/wintun-0.14.1.zip -OutFile wintun.zip
          Expand-Archive wintun.zip -DestinationPath wintun-src
          New-Item -ItemType Directory -Force engine/cmd/sondershield/wintun | Out-Null
          Copy-Item wintun-src/wintun/bin/amd64/wintun.dll engine/cmd/sondershield/wintun/wintun.dll
      - name: Build SonderShield.exe
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          cd engine
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath \
            -ldflags "-s -w -H=windowsgui -X main.version=$VERSION" -o ../dist/SonderShield.exe ./cmd/sondershield
          cp cmd/sondershield/wintun/wintun.dll ../dist/
      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          $v = "$env:GITHUB_REF_NAME".TrimStart('v')
          & $iscc "/DAppVersion=$v" "/DSrc=..\dist" installer\sondershield.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Upload to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT || github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp dist/SonderShield.exe "SonderShield-Windows-$VERSION.exe"
          (cd dist && 7z a -tzip "../SonderShield-Windows-$VERSION.zip" SonderShield.exe > /dev/null)
          gh release upload "$GITHUB_REF_NAME" \
            "out/SonderShield-Setup-$VERSION.exe" "SonderShield-Windows-$VERSION.exe" "SonderShield-Windows-$VERSION.zip" \
            --repo "$GITHUB_REPOSITORY" --clobber

  linux:
    name: Linux AppImage
    needs: release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false
      - name: Build tools
        shell: bash
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libwebkit2gtk-4.1-dev > /dev/null
      - name: Build the AppImage
        shell: bash
        run: |
          set -o pipefail
          cd engine && go mod tidy && cd ..
          tools/build_appimage.sh "${GITHUB_REF_NAME#v}" dist 2>&1 | tee linux-build.log
      - name: Upload to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT || github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" dist/*.AppImage dist/sondershield-linux-x86_64 \
            --repo "$GITHUB_REPOSITORY" --clobber
      - name: Report the failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          touch linux-build.log
          gh release view ci-failure --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create ci-failure --repo "$GITHUB_REPOSITORY" --prerelease \
              --title "Last CI failure" --notes "Replaced on every failed build."
          { echo "$GITHUB_WORKFLOW (Linux) on $GITHUB_REF_NAME at $GITHUB_SHA"; tail -n 200 linux-build.log; } > failure.txt
          gh release upload ci-failure failure.txt --repo "$GITHUB_REPOSITORY" --clobber
