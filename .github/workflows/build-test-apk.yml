name: Test APK

on:
  push:
    branches: ['test/**']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore the signing key
        shell: bash
        env:
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
        run: |
          if [ -z "$RELEASE_KEYSTORE" ]; then
            echo "::error::RELEASE_KEYSTORE is not set. Nothing can be signed."
            exit 1
          fi
          echo "$RELEASE_KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: false
      - name: Build the engine
        shell: bash
        run: tools/build_engine.sh 2>&1 | tee engine.log
      - name: Build
        shell: bash
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -o pipefail
          gradle --no-daemon assembleRelease 2>&1 | tee build-output.txt
      - name: Publish as a pre-release in this repository
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SLUG=$(echo "${GITHUB_REF_NAME#test/}" | tr '/' '-')
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          if [ -z "$APK" ]; then
            echo "::error::No APK was produced."
            exit 1
          fi
          cp "$APK" "SonderShield-$SLUG.apk"
          gh release delete "test-$SLUG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create "test-$SLUG" "SonderShield-$SLUG.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "SonderShield test: $SLUG" \
            --notes "Test build from $GITHUB_REF_NAME at $GITHUB_SHA"

      - name: Report the failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          touch out.txt
          for f in engine.log build-output.txt; do
            [ -f "$f" ] && { echo "== $f"; tail -n 200 "$f"; } >> out.txt
          done
          gh release view ci-failure --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create ci-failure --repo "$GITHUB_REPOSITORY" --prerelease \
              --title "Last CI failure" --notes "Replaced on every failed build."
          echo "$GITHUB_WORKFLOW on $GITHUB_REF_NAME at $GITHUB_SHA" | cat - out.txt > failure.txt
          gh release upload ci-failure failure.txt --repo "$GITHUB_REPOSITORY" --clobber
