name: Checks

# Text-only changes (README, release notes, other docs) don't need a full build.
on:
  push:
    branches: [main, 'test/**']
    paths-ignore: ['**.md', 'docs/**', 'LICENSE', 'NOTICE']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'LICENSE', 'NOTICE']

permissions:
  contents: write

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false
      - name: Resolve engine dependencies
        shell: bash
        run: cd engine && go mod tidy
      - name: Build the engine
        shell: bash
        run: tools/build_engine.sh 2>&1 | tee engine.log
      - name: Windows cross-build
        shell: bash
        run: |
          mkdir -p engine/cmd/sondershield/wintun
          curl -sfL -o wintun.zip https://www.wintun.net/builds/wintun-0.14.1.zip
          unzip -q -j wintun.zip wintun/bin/amd64/wintun.dll -d engine/cmd/sondershield/wintun
          cd engine && GOOS=windows GOARCH=amd64 go build ./...
      - name: Linux window
        shell: bash
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libwebkit2gtk-4.1-dev > /dev/null
          cc -O2 -Wall linux/window/sondershield-window.c -o /tmp/sondershield-window \
            $(pkg-config --cflags --libs gtk+-3.0 webkit2gtk-4.1) 2>&1 | tee linux-window.log
      - name: Engine tests
        shell: bash
        run: |
          set -o pipefail
          cd engine && go vet ./... && go test -race ./... 2>&1 | tee ../engine-tests.txt
      - name: Unit tests and debug build
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon testDebugUnitTest assembleDebug 2>&1 | tee build-output.txt
      - name: Report the failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # CI logs are not fetchable from outside, so the error is attached to a
          # pre-release called ci-failure in this repository, where the API can read it.
          touch out.txt
          for f in engine.log linux-window.log engine-tests.txt build-output.txt; do
            [ -f "$f" ] && { echo "== $f"; tail -n 200 "$f"; } >> out.txt
          done
          gh release view ci-failure --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create ci-failure --repo "$GITHUB_REPOSITORY" --prerelease \
              --title "Last CI failure" --notes "Replaced on every failed build."
          echo "$GITHUB_WORKFLOW on $GITHUB_REF_NAME at $GITHUB_SHA" | cat - out.txt > failure.txt
          gh release upload ci-failure failure.txt --repo "$GITHUB_REPOSITORY" --clobber
